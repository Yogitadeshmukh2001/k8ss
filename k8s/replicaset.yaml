apiVersion: apps/v1
kind: ReplicaSet
metadata:
  name: myreplicaset
  labels:
    app: myreplicaset
    key: value
spec:
  replicas: 5
  selector:
    matchLabels:
      env: value
      app: mynginx
      matchExpressions:
      - {key: env, operator: In, values: [dev]}
      
  template:
    metadata:
      labels:
        env: dev
    spec:
      containers:
      - name: myreplicaset
        image: nginx
        ports:
        - containerPort: 80