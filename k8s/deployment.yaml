apiVersion: apps/v1
kind: Deployment
metadata:
  name: myapp1
  labels:
    app: myapp1
  

spec:
  replicas: 5
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
      maxSurge: 1
  selector:
    matchLabels:
      app: mynginx
    matchExpressions:
      - {key: env, operator: In, values: [dev]}
  template:
    metadata:
      labels:
        env: dev
        app: mynginx
    spec:
      containers:
      - name: myapp1
        image: nginx
        resources:
          limits:
            memory: "128Mi"
            cpu: "500m"
        ports:
        - containerPort: 80
        